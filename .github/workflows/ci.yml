name: ci

on:
  push:
  pull_request:

jobs:
  # macOS is verified locally (mise run test); CI covers the platform-specific socket and
  # gateway code of Linux and Windows.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LITENETLIB_SRC: ${{ github.workspace }}/LiteNetLib/LiteNetLib
      CGO_ENABLED: "1" # -race needs cgo
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-litenetlib
      - uses: actions/checkout@v4
        with:
          repository: RevenantX/LiteNetLib
          ref: v0.8.3
          path: LiteNetLib
      - uses: jdx/mise-action@v2 # installs the [tools] of mise.toml
        with:
          working_directory: go-litenetlib
      - name: Make TEST-NET-3 unreachable (exercises HostUnreachable)
        if: runner.os == 'Linux'
        run: sudo ip route add unreachable 203.0.113.0/24
      # The debug build only adds statistics and the network simulation, which are
      # platform independent, so it runs on Linux alone.
      - name: Test (release and debug builds)
        if: runner.os == 'Linux'
        working-directory: go-litenetlib
        run: mise run test
      - name: Test (release build)
        if: runner.os != 'Linux'
        working-directory: go-litenetlib
        run: mise run test:release
