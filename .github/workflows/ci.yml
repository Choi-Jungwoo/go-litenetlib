name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LITENETLIB_SRC: ${{ github.workspace }}/LiteNetLib/LiteNetLib
      CGO_ENABLED: "1" # -race needs cgo
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-litenetlib
      - uses: actions/checkout@v4
        with:
          repository: RevenantX/LiteNetLib
          ref: v0.8.3
          path: LiteNetLib
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-litenetlib/go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Make TEST-NET-3 unreachable (exercises HostUnreachable)
        if: runner.os == 'Linux'
        run: sudo ip route add unreachable 203.0.113.0/24
      - name: Test (release build)
        working-directory: go-litenetlib
        run: go test -race -count=1 -v ./...
      - name: Test (debug build)
        working-directory: go-litenetlib
        run: go test -race -count=1 -tags debug -v ./...
