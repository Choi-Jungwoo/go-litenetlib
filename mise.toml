[tools]
go = "1.27.2"
# Builds the LiteNetLib v0.8.3 interop client used by the tests.
dotnet = "10.0.400"

[tasks.fmt]
run = "gofmt -l -w ."

[tasks.vet]
run = "go vet ./..."

[tasks.test]
run = [{ task = "test:release" }, { task = "test:debug" }]

[tasks."test:release"]
run = "go test -race ./..."

[tasks."test:debug"]
run = "go test -race -tags debug ./..."

[tasks.bench]
run = "go test -run '^$' -bench . -benchmem ./..."
